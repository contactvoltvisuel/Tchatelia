services:
  - type: web
    name: tchatelia
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_SSL
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_ALLOWED_IPS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_PROTECTION
        value: "true"
      - key: SECURITY_HASH_SECRET
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: "Tchatelia"
      - key: AUTO_MODERATION
        value: "true"
      - key: AUTO_MODERATION_TERMS
        sync: false
      - key: MODERATION_ALERT_EMAIL
        sync: false
