<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tchatelia</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="login-panel" id="loginPanel">
        <div>
          <p class="eyebrow">Salons publics gratuits</p>
          <h1>Tchatelia</h1>
          <p class="intro">
            Une premiere version type EuropNet : pseudo libre, salons publics,
            messages instantanes et connectes visibles.
          </p>
        </div>

        <form class="login-form" id="loginForm">
          <div class="auth-mode">
            <label>
              <input type="radio" name="authMode" value="guest" checked />
              Invite
            </label>
            <label>
              <input type="radio" name="authMode" value="login" />
              Connexion
            </label>
            <label>
              <input type="radio" name="authMode" value="register" />
              Inscription
            </label>
          </div>

          <label for="nickname">Pseudo</label>
          <input
            id="nickname"
            name="nickname"
            maxlength="18"
            autocomplete="nickname"
            placeholder="TonPseudo"
            required
          />

          <label for="accountPassword">Mot de passe du compte</label>
          <input
            id="accountPassword"
            name="accountPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Connexion ou inscription"
          />

          <label for="room">Salon</label>
          <select id="room" name="room">
            <option value="accueil">#accueil</option>
            <option value="aide">#aide</option>
            <option value="musique">#musique</option>
            <option value="rencontres">#rencontres</option>
          </select>

          <label for="adminPassword">Mot de passe admin</label>
          <input
            id="adminPassword"
            name="adminPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Optionnel"
          />

          <button type="submit">Entrer dans le chat</button>
        </form>
      </section>

      <section class="chat-panel hidden" id="chatPanel" aria-label="Chat">
        <aside class="sidebar">
          <div class="brand">
            <span class="status-dot"></span>
            <strong>Tchatelia</strong>
          </div>
          <div>
            <h2>Salons</h2>
            <div class="room-list" id="roomList"></div>
          </div>
          <div>
            <h2>Connectes</h2>
            <ul class="user-list" id="userList"></ul>
          </div>
          <div class="admin-panel hidden" id="adminPanel">
            <h2>Admin</h2>
            <div class="admin-user-list" id="adminUserList"></div>
            <form class="admin-unban-form" id="adminUnbanForm">
              <input
                id="adminUnbanInput"
                maxlength="18"
                autocomplete="off"
                placeholder="Pseudo a debannir"
              />
              <button type="submit">Unban</button>
            </form>
            <form class="admin-room-form" id="adminRoomCreateForm">
              <input
                id="adminRoomNameInput"
                maxlength="24"
                autocomplete="off"
                placeholder="Nouveau salon"
              />
              <input
                id="adminRoomTopicInput"
                maxlength="90"
                autocomplete="off"
                placeholder="Sujet du salon"
              />
              <button type="submit">Creer salon</button>
            </form>
            <form class="admin-room-form" id="adminRoomTopicForm">
              <input
                id="adminCurrentTopicInput"
                maxlength="90"
                autocomplete="off"
                placeholder="Nouveau sujet du salon actuel"
              />
              <button type="submit">Modifier sujet</button>
            </form>
            <button class="danger-button" id="adminDeleteRoomButton" type="button">
              Supprimer ce salon
            </button>
            <div class="admin-account-panel">
              <div class="admin-section-title">
                <h2>Comptes</h2>
                <button id="adminRefreshAccountsButton" type="button">Actualiser</button>
              </div>
              <div class="admin-account-list" id="adminAccountList"></div>
            </div>
          </div>
        </aside>

        <div class="conversation">
          <header class="chat-header">
            <div>
              <p class="eyebrow" id="roomName">#accueil</p>
              <h1 id="roomTopic">Salon general pour discuter librement.</h1>
            </div>
            <button class="ghost-button" id="leaveButton" type="button">Sortir</button>
          </header>

          <div class="messages" id="messages" aria-live="polite"></div>

          <form class="message-form" id="messageForm">
            <input
              id="messageInput"
              maxlength="500"
              autocomplete="off"
              placeholder="Ecris un message... /help affiche les commandes"
            />
            <button type="submit">Envoyer</button>
          </form>
        </div>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
